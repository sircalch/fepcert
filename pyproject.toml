[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fepcert"
version = "1.0.0"
description = "Automated Quality-Control, Phase Space Overlap, and Thermodynamic Cycle Closure Certification for Alchemical Free Energy Calculations (FEP, TI, BAR, MBAR)"
readme = "README.md"
authors = [
    { name = "Andres Monreal-Hernández", email = "amonreal@example.com" }
]
license = { text = "MIT" }
keywords = [
    "free-energy-perturbation",
    "fep",
    "thermodynamic-integration",
    "mbar",
    "bennett-acceptance-ratio",
    "alchemical-free-energy",
    "gromacs",
    "amber",
    "openmm",
    "namd",
    "drug-discovery",
    "binding-free-energy",
    "cycle-closure",
    "reproducibility"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "jinja2>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "build>=0.10.0",
    "twine>=4.0.0"
]

[project.scripts]
fepcert = "fepcert.cli:main"

[project.urls]
Homepage = "https://github.com/sircalch/fepcert"
Documentation = "https://github.com/sircalch/fepcert#readme"
Repository = "https://github.com/sircalch/fepcert.git"
"Bug Tracker" = "https://github.com/sircalch/fepcert/issues"
Changelog = "https://github.com/sircalch/fepcert/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["fepcert*"]


